name: Horizon port validation
on:
  push:
    branches: [feature/dh-port]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/horizon-check.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/horizon-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horizon-runtime
          path: tmp/horizon-smoke
